<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shashi's Portfolio</title>
    <link rel="icon" href="/favicon-v2.png" />
    <link rel="icon" type="image/png" href="/favicon-v2.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon-v2.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9MVDQVBQM5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-9MVDQVBQM5');
    </script>
    
    <!-- Pre-render theme initializer to prevent any color flash -->
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var viewParam = params.get('view');
          var savedView = localStorage.getItem('portfolio.view_mode');
          var mode = (viewParam === 'dev' || viewParam === 'recruiter') 
            ? viewParam 
            : (savedView === 'dev' || savedView === 'recruiter') 
              ? savedView 
              : 'recruiter';

          var isDev = mode === 'dev';
          var devSaved = localStorage.getItem('portfolio.palette.dev');
          var hrSaved = localStorage.getItem('portfolio.palette.hr');

          var paletteMap = {
            'terminal-green': { bg: '#0b0f14', card: '#111827', accent: '#00ff9f' },
            'tokyo-night': { bg: '#1a1b26', card: '#24283b', accent: '#7aa2f7' }
          };

          var targetId = isDev ? (devSaved || 'terminal-green') : (hrSaved || 'tokyo-night');
          var pal = paletteMap[targetId] || (isDev ? paletteMap['terminal-green'] : paletteMap['tokyo-night']);

          var root = document.documentElement;
          root.style.setProperty('--c-bg', pal.bg);
          root.style.setProperty('--c-card', pal.card);
          root.style.setProperty('--c-accent', pal.accent);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
